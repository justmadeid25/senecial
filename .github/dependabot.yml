version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Phase 10C §28 - group routine patch/minor bumps into one PR per week
      # rather than one PR per package; a major bump (more likely to need a
      # manual look, e.g. a Next.js/Prisma major) still gets its own PR.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
