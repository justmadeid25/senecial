name: CI

# Phase 10C Part D - runs on every PR and every push to main. Postgres/Redis/
# MinIO run as GitHub-hosted service containers (§17/§18) - no external
# network access and no real Postmark/S3 credentials are required for this
# workflow, so it runs identically on a fork PR with no repository secrets.
# Real-infra opt-in tests (tests/integration/postmark-real.test.ts,
# s3-storage-real.test.ts, redis-rate-limit-real.test.ts) stay skipped here -
# see nightly-real-infra.yml for those.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every job below uses this same throwaway, non-secret dev password -
  # matches docker-compose.yml's own "development-only-password" convention.
  # Never a real credential; safe to hardcode in a public workflow file.
  PGPASSWORD: development-only-password
  DATABASE_URL: postgresql://senecial:development-only-password@localhost:5432/senecial_test?schema=public
  AUTH_SECRET: ci-only-secret-not-for-production-use-000000000000
  AUTH_URL: http://localhost:3000
  APP_URL: http://localhost:3000

jobs:
  # §17 items 1-6: install, generate, typecheck, lint, unit+integration tests.
  quality-and-tests:
    name: Quality checks + unit/integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # §Phase 12.2 - pgvector/pgvector:pg18 (official pgvector project
        # image, PostgreSQL 18 with the vector extension pre-installed) -
        # plain postgres:18-alpine cannot run the pgvector_clause_embeddings
        # migration's `CREATE EXTENSION vector`. Same PostgreSQL major
        # version as before, just with the extension available.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: senecial_test
          POSTGRES_USER: senecial
          POSTGRES_PASSWORD: development-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U senecial -d senecial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm exec prisma generate

      - name: TypeScript
        run: pnpm exec tsc --noEmit

      - name: ESLint
        run: pnpm exec eslint .

      - name: Apply migrations (test database)
        run: pnpm exec prisma migrate deploy

      - name: Unit + integration tests
        run: pnpm exec vitest run
        env:
          REDIS_URL: redis://localhost:6379

      - name: Build
        run: pnpm build

  # §20 - migration deploy must succeed against a completely empty database,
  # independent of whatever schema state the tests job's DB ends up in.
  # §21 - drift check: the migrations directory replayed from scratch must
  # produce a schema identical to schema.prisma, with no manual/out-of-band
  # changes and no leftover `prisma migrate dev` state ever committed.
  migration-validation:
    name: Migration deploy + drift check (empty database)
    runs-on: ubuntu-latest
    services:
      postgres:
        # §Phase 12.2 - pgvector/pgvector:pg18 (official pgvector project
        # image, PostgreSQL 18 with the vector extension pre-installed) -
        # plain postgres:18-alpine cannot run the pgvector_clause_embeddings
        # migration's `CREATE EXTENSION vector`. Same PostgreSQL major
        # version as before, just with the extension available.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: senecial_migration_check
          POSTGRES_USER: senecial
          POSTGRES_PASSWORD: development-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U senecial -d senecial_migration_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://senecial:development-only-password@localhost:5432/senecial_migration_check?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - name: prisma validate
        run: pnpm exec prisma validate
      - name: prisma migrate deploy (empty database)
        run: pnpm exec prisma migrate deploy
      - name: Drift check - migrations vs schema.prisma
        # --exit-code: 0 = no diff (migrations, replayed from scratch, match
        # schema.prisma exactly), 2 = non-empty diff (drift - e.g. a
        # hand-edited schema.prisma with no corresponding migration file),
        # 1 = a real command error. `--from-config-datasource` diffs against
        # the database this job just ran `prisma migrate deploy` on above.
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema=prisma/schema.prisma --script --exit-code
      # §Phase 12.3 Part A (§4) - runs against the PRISTINE database this
      # job just built from scratch via `migrate deploy` above - the
      # strongest possible check that the full migration history (extension/
      # HNSW index/core columns included) is self-sufficient, never
      # dependent on manual post-migration steps a fresh deployment would
      # never get.
      - name: Verify migrations (checksums, extension, HNSW index, core columns)
        run: pnpm db:verify-migrations

  # §17 item 9 - build the production Dockerfile on every PR (build only,
  # never pushed here - see docker.yml for the push-on-merge job). Never
  # runs `prisma migrate dev` anywhere in this pipeline (§20).
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: senecial:ci-${{ github.sha }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # §17 item 10 - secret scan. Runs on the full PR diff (fetch-depth 0) so a
  # secret introduced anywhere in the branch's history is caught, not just
  # the latest commit.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # §17 item 11 - dependency audit with a severity policy rather than an
  # all-or-nothing gate: critical/high vulnerabilities block the merge,
  # moderate/low are reported but never fail the build (§28).
  dependency-audit:
    name: Dependency audit (pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit - full report (never fails the build by itself)
        run: pnpm audit || true
      - name: pnpm audit - fail only on critical/high (§28)
        run: pnpm audit --audit-level=high

  # §18 - E2E is a separate job (own service containers, own long-running
  # Playwright browser install) so a slow/flaky UI test never blocks the
  # fast unit/integration feedback loop above.
  #
  # §Phase 12.3 Part B (§5) - this is the FAST `next dev`-based suite,
  # useful as quick PR feedback - it is NOT the release gate (§20's own
  # explicit instruction: "next dev 기반 전체 E2E는 release 필수 gate로
  # 사용하지 마십시오"). See the `e2e-production-like` job below for the
  # actual release-blocking E2E check (real `next build` + `next start`).
  e2e:
    name: E2E (Playwright, next dev - fast PR feedback only, not release gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        # §Phase 12.2 - pgvector/pgvector:pg18 (official pgvector project
        # image, PostgreSQL 18 with the vector extension pre-installed) -
        # plain postgres:18-alpine cannot run the pgvector_clause_embeddings
        # migration's `CREATE EXTENSION vector`. Same PostgreSQL major
        # version as before, just with the extension available.
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: senecial_test
          POSTGRES_USER: senecial
          POSTGRES_PASSWORD: development-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U senecial -d senecial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      minio:
        image: minio/minio:latest
        env:
          MINIO_ROOT_USER: senecial
          MINIO_ROOT_PASSWORD: development-only-password
        ports: ["9000:9000"]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10
        # MinIO's official image needs an explicit command; GitHub Actions
        # service containers don't accept `command:`, so this workflow only
        # verifies MinIO comes up healthy - FILE_STORAGE_DRIVER stays
        # "local" for the E2E run below (S3-mode E2E is exercised via
        # tests/integration/s3-storage-real.test.ts's opt-in path instead).
    env:
      DATABASE_URL: postgresql://senecial:development-only-password@localhost:5432/senecial_test?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production-use-000000000000
      FILE_STORAGE_DRIVER: local
      RATE_LIMITER: redis
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers
        # `--with-deps` (system-level libs) still needs to run even on a
        # cache hit - only the downloaded browser binaries themselves are
        # cached; `pnpm exec playwright install-deps` alone would skip
        # re-downloading browsers but Playwright itself checks the cache
        # dir and no-ops quickly when a hit already has everything.
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E suite (fast, next dev)
        run: pnpm test:e2e:dev
      # §18 - never upload a raw server log or trace without checking it
      # first: this repo's own logging never prints tokens/passwords/full
      # emails (see src/domain/logging), and Playwright traces never
      # capture env vars, only page/network activity - but artifacts are
      # only uploaded on failure, and only the trace/report, never `.env*`.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # §Phase 12.3 Part B/G (§5/§20) - the ACTUAL release-blocking E2E check:
  # real `next build` + `next start` (NODE_ENV=production, the genuine
  # production server code path - never Turbopack's `next dev` dev-compiler
  # workers, the confirmed-but-not-fully-root-caused source of the crashes
  # found in Phase 12.2 - see docs/operations/e2e-testing.md). Real Redis
  # (not memory) for the concurrency limiter/distributed lock/cache
  # provider - doubles as CI coverage for Phase 12.3 Part D.
  e2e-production-like:
    name: E2E (production-like, next start) - RELEASE GATE
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: senecial_e2e
          POSTGRES_USER: senecial
          POSTGRES_PASSWORD: development-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U senecial -d senecial_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://senecial:development-only-password@localhost:5432/senecial_e2e?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production-use-000000000000
      REDIS_URL: redis://localhost:6379
      FILE_STORAGE_DRIVER: local
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run production-like E2E suite (next build + next start)
        run: pnpm test:e2e:prod
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production-like
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # §Phase 12.2 Part H (§41) - `pnpm ai:evaluate --compare --gate` blocks the
  # merge on any AI quality/security regression against the Phase 12.1
  # baseline (domain/ai/evaluation/release-gate.ts) - both the pgvector AND
  # application provider paths must pass (§28 - a fallback path that can't
  # meet baseline quality must not be trusted in production either).
  ai-quality-gate:
    name: AI quality gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: senecial_test
          POSTGRES_USER: senecial
          POSTGRES_PASSWORD: development-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U senecial -d senecial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://senecial:development-only-password@localhost:5432/senecial_test?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production-use-000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm exec prisma migrate deploy
      # §Phase 12.3 Part G (§20) - the release gate runs the migration
      # verifier BEFORE the AI evaluation gate - a broken/drifted migration
      # (missing pgvector extension, missing HNSW index) should fail loud
      # and fast, never silently degrade AI evaluation quality numbers in a
      # way that's hard to attribute back to its real cause.
      - name: Verify migrations
        run: pnpm db:verify-migrations
      - name: AI evaluation release gate (application + pgvector, provider-stratified baseline)
        run: pnpm ai:evaluate --compare --gate
      # §26 - the JSON report is the CI-consumable form (evaluateReleaseGate()'s
      # exact violations, not just the console summary) - uploaded always,
      # not only on failure, since it's also the quality record for a
      # PASSING run. Contains only metrics/scores/synthetic golden-dataset
      # text - never a real credential or contract.
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation-reports
          path: reports/ai-evaluation-*.json
          retention-days: 30

  # §Phase 12.2 Part H (§41 e2e-determinism-smoke) - a SMALL-scale flake
  # check on every PR (§39's full 10-run/30-run passes belong in a nightly
  # job, not blocking every PR) - runs the repeat-runner against the
  # fastest representative spec so a newly-introduced flake is caught
  # before merge, without materially slowing down CI.
  e2e-determinism-smoke:
    name: E2E determinism smoke (repeat-runner)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: senecial_test
          POSTGRES_USER: senecial
          POSTGRES_PASSWORD: development-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U senecial -d senecial_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://senecial:development-only-password@localhost:5432/senecial_e2e?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production-use-000000000000
      AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      FILE_STORAGE_DRIVER: local
      RATE_LIMITER: redis
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      # §42 Flake 정책 - this job does NOT retry on failure by itself; a
      # failing run here means "this spec was flaky N times in a row",
      # which is exactly the signal §7/§8 exist to surface, not something
      # to paper over with a blind CI-level retry.
      - name: Repeat-run a representative spec (flake detection)
        run: pnpm test:e2e:repeat --runs=3 --spec=tests/e2e/auth-flow.spec.ts
      - name: Upload flake report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-repeat-report
          path: |
            reports/e2e-repeat-report.json
            reports/e2e-repeat-report.md
          retention-days: 30

  # §Phase 12.4 §13/§14 - the actual release gate: `pnpm release:verify` run
  # exactly as documented (scripts/release-verify.ts), start to finish, in
  # one job - so a human running the same command locally sees exactly
  # what blocks a release. This intentionally overlaps with the more
  # granular jobs above (quality-and-tests, migration-validation,
  # ai-quality-gate, e2e-production-like) which stay in place for FAST
  # parallel PR feedback (a typecheck failure surfaces in ~1 minute, not
  # after waiting for a 10+ minute E2E run) - this job is the single
  # source of truth for "is release:verify itself green", not a
  # replacement for that parallelism.
  #
  # No external credentials needed - Postgres/pgvector/Redis run as
  # GitHub-hosted service containers, identical to the jobs above. Real
  # Postmark/S3 tests stay opt-in/skipped here (see nightly-real-infra.yml).
  #
  # One database (senecial_e2e) for the whole job, not one-per-step -
  # release:verify's steps run strictly sequentially (never concurrently),
  # so sharing is safe: each step that needs a clean slate (vitest, the
  # E2E run) already resets/truncates its own tables before using it. This
  # is the one deliberate divergence from the dedicated-DB-per-test-type
  # convention the other jobs use - acceptable here specifically because
  # release:verify is designed to run end-to-end as a single sequential
  # pipeline, never in parallel with itself.
  release-verify:
    name: release:verify (full release gate)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: senecial_e2e
          POSTGRES_USER: senecial
          POSTGRES_PASSWORD: development-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U senecial -d senecial_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://senecial:development-only-password@localhost:5432/senecial_e2e?schema=public
      AUTH_SECRET: ci-only-secret-not-for-production-use-000000000000
      AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      FILE_STORAGE_DRIVER: local
      RATE_LIMITER: redis
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      # Bootstraps the shared database BEFORE release:verify's own step 2
      # (migration verifier) runs - that step expects an already-migrated
      # database, never a bare empty one (it verifies checksums/indexes/
      # columns, it does not itself apply migrations).
      - name: Bootstrap database (prisma migrate deploy)
        run: pnpm exec prisma migrate deploy
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - name: pnpm release:verify
        run: pnpm release:verify
      - name: Upload release:verify artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verify-reports
          path: |
            reports/
            playwright-report/
            test-results/
          retention-days: 30
