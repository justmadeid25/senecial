# Senecial malware scanner - freshclam config (Dockerfile.scanner).
#
# Container already runs as the `clamav` user (owner of /var/lib/clamav
# via the clamav-daemon package's postinst), so no DatabaseOwner directive
# is needed - freshclam would try to setuid to a user it already is.

DatabaseDirectory /var/lib/clamav
UpdateLogFile /tmp/freshclam.log
DatabaseMirror database.clamav.net
Checks 12

# Never self-daemonize (fork+exit) - scripts/malware-scanner-server.ts
# spawns this as a tracked child process for both the one-shot startup
# fetch and the --daemon background updater, and needs the pid it gets
# back from spawn() to stay the live process for signal/exit handling.
Foreground yes
