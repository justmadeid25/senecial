# Senecial malware scanner - clamd config (Dockerfile.scanner).
#
# The whole scanner container runs as the `clamav` user from the start
# (no root -> setuid drop), so there is deliberately no `User` directive
# here - clamd would try to setuid to a user it already is, which errors
# when not running as root.

LocalSocket /tmp/clamd.sock
FixStaleSocket yes
LocalSocketMode 666

# Slightly above MAX_BODY_BYTES in scripts/malware-scanner-server.ts (25MB)
# so a max-size upload is never rejected by clamd itself before scanning.
MaxFileSize 30M
StreamMaxLength 30M
MaxScanSize 100M

# clamdscan is invoked with --fdpass (see scripts/malware-scanner-server.ts)
# so clamd never needs read access to our temp-file path directly - it
# scans the passed file descriptor instead.
LogTime yes
PidFile /tmp/clamd.pid
